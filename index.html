<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bu Marka — Membership & Community Management Platform</title>
  <meta name="description" content="Run your entire membership operation in one place. Members, events, payments, and communications — all in Bu Marka." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* ── SaaS design tokens (homepage) ── */
            'saas-dark':    '#0B0D1A',
            'saas-surface': '#111322',
            'saas-card':    '#13162A',
            'saas-border':  '#1C1F35',
            'saas-muted':   '#94A3B8',
            'saas-subtle':  '#475569',
            'saas-violet':  '#6366F1',
            'saas-violet-l':'#818CF8',
            'saas-purple':  '#8B5CF6',
            'saas-emerald': '#10B981',
            'saas-amber':   '#F59E0B',
            /* ── Brand tokens — change here to retheme all product pages ── */
            'brand-primary':   '#6366F1',
            'brand-primary-h': '#4F46E5',
            'brand-primary-d': '#4338CA',
            'brand-secondary': '#8B5CF6',
            'brand-dark':      '#4D4D4D',
            'brand-gray':      '#717171',
            'brand-light':     '#EEF2FF',
            'brand-silver':    '#F5F7FA',
          },
          fontFamily: {
            sans:    ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body class="antialiased">
  <div id="root"></div>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
